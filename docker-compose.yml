version: "3.8"

services:
  # Nginx - Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./web/dist:/usr/share/nginx/html
    depends_on:
      - api
    restart: unless-stopped

  # API - Backend
  api:
    build: ./api
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-recall-ai-jwt-secret-2026}
    restart: unless-stopped

  # Redis - Cache & Message Queue
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

